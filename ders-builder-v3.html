<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ders Builder — No-Code Statik Sayfa Üretici</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg-base:      #070d19;
  --bg-panel:     rgba(15,23,42,0.74);
  --bg-surface:   rgba(255,255,255,0.035);
  --bg-elevated:  rgba(255,255,255,0.06);
  --bg-hover:     rgba(255,255,255,0.06);
  --border:       rgba(59,130,246,0.16);
  --border-hover: rgba(59,130,246,0.36);
  --blue:         #3b82f6;
  --blue-bright:  #60a5fa;
  --blue-glow:    rgba(59,130,246,0.4);
  --text:         #ffffff;
  --text-dim:     #cbd5e1;
  --text-faint:   rgba(226,232,240,0.42);
  --green:        #4fd69c;
  --amber:        #ffd250;
  --rose:         #f07068;
  --radius:       14px;
  --radius-sm:    8px;
  --tr:           0.18s cubic-bezier(.4,0,.2,1);
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-base); color: var(--text);
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 900px 500px at -10% -10%, rgba(59,130,246,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 110% 20%, rgba(96,165,250,0.08), transparent 60%);
  background-attachment: fixed;
}
button, input, select, textarea { font-family: inherit; }

.app { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 66px; flex-shrink: 0; padding: 0 26px;
  background: rgba(7,13,25,0.78);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(59,130,246,0.1), 0 12px 30px rgba(0,0,0,0.35);
  z-index: 50; position: relative;
}
.topbar-brand { display: flex; align-items: center; gap: 13px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  background: linear-gradient(150deg, var(--blue), var(--blue-bright));
  display: flex; align-items: center; justify-content: center; color: #071022;
  box-shadow: 0 4px 16px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.tb-title { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.tb-sub { display: block; font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
.topbar-actions { display: flex; align-items: center; gap: 14px; }
.block-count {
  font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-surface);
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 17px; border-radius: 10px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-dim);
  cursor: pointer; transition: all var(--tr); white-space: nowrap;
}
.btn:hover { border-color: var(--border-hover); color: var(--text); background: var(--bg-hover); transform: translateY(-1px); }
.btn-blue {
  background: linear-gradient(150deg, var(--blue), var(--blue-bright));
  border-color: transparent; color: #071022;
  box-shadow: 0 4px 18px rgba(59,130,246,0.32), inset 0 1px 0 rgba(255,255,255,0.35);
}
.btn-blue:hover { filter: brightness(1.07); box-shadow: 0 6px 26px var(--blue-glow), 0 0 0 3px rgba(59,130,246,0.16), inset 0 1px 0 rgba(255,255,255,0.4); transform: translateY(-1px); }
.btn-danger-ghost:hover { border-color: rgba(240,112,104,0.4); color: var(--rose); box-shadow: 0 0 16px rgba(240,112,104,0.15); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.workspace { flex: 1; display: flex; min-height: 0; }

.sidebar {
  width: 254px; flex-shrink: 0; overflow-y: auto; padding: 22px 15px;
  background: rgba(9,15,28,0.6); backdrop-filter: blur(18px);
  border-right: 1px solid var(--border);
}
.sidebar-label {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--blue-bright); margin: 4px 8px 12px; opacity: 0.9;
}
.add-block-btn {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 11px 13px; margin-bottom: 7px;
  border-radius: 11px; border: 1px solid transparent;
  background: transparent; color: var(--text-dim);
  font-size: 13.5px; font-weight: 500; text-align: left; cursor: pointer;
  transition: all var(--tr); position: relative; overflow: hidden;
}
.add-block-btn::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(120deg, rgba(59,130,246,0.14), transparent 60%);
  opacity: 0; transition: opacity var(--tr);
}
.add-block-btn:hover { background: var(--bg-surface); border-color: var(--border); color: var(--text); transform: translateX(2px); }
.add-block-btn:hover::before { opacity: 1; }
.add-block-btn .abx-ico {
  flex-shrink: 0; color: var(--blue-bright); opacity: 0.95; width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; background: rgba(59,130,246,0.1);
}
.sidebar-hint {
  margin-top: 24px; padding: 14px 15px;
  background: linear-gradient(160deg, rgba(59,130,246,0.1), rgba(59,130,246,0.02));
  border: 1px solid var(--border); border-radius: 12px;
  font-size: 11.5px; line-height: 1.65; color: var(--text-faint);
}
.sidebar-hint b { color: var(--blue-bright); font-weight: 700; }

.canvas-wrap { flex: 1; overflow-y: auto; }
.canvas { max-width: 780px; margin: 0 auto; padding: 48px 28px 160px; min-height: 100%; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 100px 20px; color: var(--text-faint);
  border: 1.5px dashed var(--border); border-radius: var(--radius);
  background: var(--bg-surface);
}
.empty-state .es-ico {
  width: 64px; height: 64px; border-radius: 18px; margin-bottom: 18px;
  background: linear-gradient(150deg, rgba(59,130,246,0.18), rgba(59,130,246,0.03));
  display: flex; align-items: center; justify-content: center; color: var(--blue-bright);
  box-shadow: inset 0 0 0 1px rgba(59,130,246,0.25);
}
.empty-state h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 21px; color: var(--text); margin: 0 0 7px; font-weight: 700; }
.empty-state p { margin: 0; font-size: 13px; max-width: 300px; line-height: 1.65; }

.block {
  position: relative; margin-bottom: 20px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-panel); backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: 0 10px 30px rgba(0,0,0,0.32);
  transition: border-color var(--tr), box-shadow var(--tr);
}
.block:hover { border-color: var(--border-hover); }
.block:focus-within { border-color: rgba(59,130,246,0.55); box-shadow: 0 10px 30px rgba(0,0,0,0.32), 0 0 0 3px rgba(59,130,246,0.12); }

.block-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.02); border-radius: var(--radius) var(--radius) 0 0;
}
.block-type-label { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-faint); }
.block-type-label svg { color: var(--blue-bright); }
.block-actions { display: flex; align-items: center; gap: 2px; }
.block-actions button {
  width: 29px; height: 29px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 8px; color: var(--text-faint); cursor: pointer; transition: all var(--tr);
}
.block-actions button:hover { background: var(--bg-hover); color: var(--text); box-shadow: 0 0 10px rgba(59,130,246,0.2); }
.block-actions button:disabled { opacity: 0.22; cursor: not-allowed; box-shadow: none; }
.block-actions button.danger:hover { color: var(--rose); background: rgba(240,112,104,0.12); box-shadow: 0 0 10px rgba(240,112,104,0.2); }
.block-actions button.active { color: var(--blue-bright); background: rgba(59,130,246,0.18); }

.block-settings { display: none; padding: 16px 18px; gap: 14px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.18); }
.block-settings.open { display: flex; }
.settings-divider { flex-basis: 100%; height: 1px; background: var(--border); margin: 2px 0; opacity: 0.7; }
.settings-group-label { flex-basis: 100%; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--blue-bright); opacity: 0.8; margin-top: 2px; }
.field-group { display: flex; flex-direction: column; gap: 6px; min-width: 92px; }
.field-group label { font-size: 10px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
.field-group input[type="text"], .field-group input[type="number"], .field-group input[type="url"], .field-group select {
  padding: 7px 10px; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-size: 12.5px; min-width: 92px;
}
.field-group input[type="color"] { width: 42px; height: 32px; padding: 2px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; }
.field-group input[type="range"] { width: 100px; accent-color: var(--blue); }
.field-group .range-val { font-size: 11px; color: var(--blue-bright); font-variant-numeric: tabular-nums; font-weight: 600; }
.align-btns { display: flex; gap: 3px; }
.align-btns button {
  width: 29px; height: 29px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 7px; color: var(--text-faint); cursor: pointer; transition: all var(--tr);
}
.align-btns button.active { color: var(--blue-bright); border-color: rgba(59,130,246,0.55); background: rgba(59,130,246,0.18); box-shadow: 0 0 10px rgba(59,130,246,0.25); }

.block-content { padding: 24px 26px; }
[contenteditable]:focus { outline: none; }
[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--text-faint); }

.img-block-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 9px; padding: 38px; border: 1.5px dashed var(--border); border-radius: 12px; color: var(--text-faint); font-size: 12.5px;
}
.img-block-empty svg { color: var(--blue-bright); opacity: 0.6; }
.block-content img.preview-img { max-width: 100%; display: block; margin: 0 auto; box-shadow: 0 12px 32px rgba(0,0,0,0.4); }
.img-url-row { display: flex; gap: 8px; margin-bottom: 12px; }
.img-url-row input { flex: 1; padding: 9px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12.5px; }
.img-alt-row input { width: 100%; padding: 8px 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-dim); font-size: 12px; margin-top: 8px; }

.vocab-card-prev {
  background: linear-gradient(160deg, rgba(59,130,246,0.08), rgba(15,23,42,0.4));
  border: 1px solid var(--border); border-left: 4px solid var(--blue);
  border-radius: 14px; padding: 22px 24px 20px; position: relative;
  box-shadow: 0 14px 34px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
}
.vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 16px; margin-bottom: 6px; }
.vocab-grid .full { grid-column: 1 / -1; }
.vocab-grid label { display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 4px; }
.vocab-grid input {
  width: 100%; padding: 9px 11px; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13.5px;
}
.vocab-grid input.de-input { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; color: var(--blue-bright); font-weight: 700; }
.vocab-tip-toggle {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 4px;
  background: none; border: none; color: var(--blue-bright); font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 4px 2px;
}
.vocab-tip-wrap { margin-top: 10px; }
.vocab-tip-wrap textarea {
  width: 100%; min-height: 52px; padding: 9px 11px; background: rgba(96,165,250,0.08);
  border: 1px solid rgba(96,165,250,0.28); border-radius: 8px; color: var(--text-dim); font-size: 12.5px; resize: vertical;
}

.callout-prev {
  border-radius: 12px; padding: 16px 20px 16px 18px; display: flex; gap: 13px;
  border: 1px solid rgba(255,210,80,0.25); background: rgba(255,210,80,0.07);
  box-shadow: 0 10px 26px rgba(255,210,80,0.06);
}
.callout-prev[data-theme="green"] { border-color: rgba(79,214,156,0.28); background: rgba(79,214,156,0.07); box-shadow: 0 10px 26px rgba(79,214,156,0.06); }
.callout-prev[data-theme="blue"]  { border-color: rgba(59,130,246,0.32);  background: rgba(59,130,246,0.09);  box-shadow: 0 10px 26px rgba(59,130,246,0.08); }
.callout-prev[data-theme="rose"]  { border-color: rgba(240,112,104,0.28); background: rgba(240,112,104,0.07); box-shadow: 0 10px 26px rgba(240,112,104,0.06); }
.callout-prev-ico { flex-shrink: 0; width: 26px; height: 26px; margin-top: 1px; color: var(--amber); }
.callout-prev[data-theme="green"] .callout-prev-ico { color: var(--green); }
.callout-prev[data-theme="blue"]  .callout-prev-ico { color: var(--blue-bright); }
.callout-prev[data-theme="rose"]  .callout-prev-ico { color: var(--rose); }
.callout-prev-body-wrap { flex: 1; min-width: 0; }
.callout-prev-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14.5px; margin-bottom: 5px; }
.callout-prev-body { font-size: 14px; line-height: 1.65; color: var(--text-dim); }

.table-toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
.tbl-prev { width: 100%; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
.tbl-prev th, .tbl-prev td { border: 1px solid var(--border); padding: 9px 11px; font-size: 13px; position: relative; }
.tbl-prev th { background: rgba(59,130,246,0.12); font-weight: 700; color: var(--text); }
.tbl-prev td { color: var(--text-dim); background: rgba(255,255,255,0.015); }
.tbl-cell-wrap { position: relative; }
.tbl-del-row, .tbl-del-col {
  position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--rose); color: #fff; border: none;
  font-size: 10px; line-height: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity var(--tr);
  top: -6px; right: -6px;
}
.tbl-prev tr:hover .tbl-del-row, .tbl-prev th:hover .tbl-del-col { opacity: 1; }

.hp-editable { min-height: 1.4em; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 200; background: rgba(3,6,14,0.8); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  background: rgba(11,17,32,0.94); backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.08);
}
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px; border-bottom: 1px solid var(--border); }
.modal-header h2 { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; }
.modal-close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 8px; color: var(--text-faint); cursor: pointer; }
.modal-close:hover { background: var(--bg-hover); color: var(--text); }
.modal-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 17px; }
.form-row label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--blue-bright); opacity: 0.9; margin-bottom: 8px; }
.form-row input, .form-row select, .form-row textarea {
  width: 100%; padding: 11px 13px; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text); font-size: 13.5px; resize: vertical;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: rgba(59,130,246,0.6); box-shadow: 0 0 0 3px rgba(59,130,246,0.14); }
.form-row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.form-hint { font-size: 11px; color: var(--text-faint); margin-top: 6px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--border); }

.dc-toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: rgba(11,17,32,0.94); backdrop-filter: blur(14px); border: 1px solid var(--border); color: var(--text);
  padding: 12px 22px; border-radius: 11px; font-size: 13px; z-index: 300;
  box-shadow: 0 14px 34px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 9px;
}
.dc-toast.ok svg { color: var(--green); } .dc-toast.err svg { color: var(--rose); }

@media (max-width: 840px) {
  .sidebar { position: fixed; left: -270px; top: 66px; bottom: 0; z-index: 60; transition: left var(--tr); box-shadow: 14px 0 40px rgba(0,0,0,0.55); }
  .sidebar.open { left: 0; }
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div><span class="tb-title">Ders Builder</span><span class="tb-sub">Premium Statik Sayfa Üretici</span></div>
    </div>
    <div class="topbar-actions">
      <span class="block-count" id="blockCount">0 blok</span>
      <button class="btn btn-danger-ghost" id="btnClearAll">Tümünü Temizle</button>
      <button class="btn btn-blue" id="btnExport">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        HTML Oluştur
      </button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-label">Blok Ekle</div>
      <button class="add-block-btn" data-type="heading"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><path d="M6 12h12"/></svg></span>Başlık</button>
      <button class="add-block-btn" data-type="paragraph"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg></span>Paragraf</button>
      <button class="add-block-btn" data-type="image"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span>Görsel</button>
      <button class="add-block-btn" data-type="vocab"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Almanca Kelime Kartı</button>
      <button class="add-block-btn" data-type="callout"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>Bilgi / Uyarı Kutusu</button>
      <button class="add-block-btn" data-type="table"><span class="abx-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg></span>Tablo</button>
      <div class="sidebar-hint"><b>İpucu:</b> İçeriğe tıklayıp doğrudan yazabilirsin. ⚙ ikonu her blok için stil, boşluk ve arka plan ayarlarını açar.</div>
    </aside>

    <main class="canvas-wrap"><div class="canvas" id="canvas"></div></main>
  </div>
</div>

<div class="modal-overlay" id="exportModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>HTML Sayfası Oluştur</h2>
      <button class="modal-close" id="closeExportModal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-row"><label for="metaTitle">Sayfa Başlığı</label><input type="text" id="metaTitle" placeholder="örn. Almanca'da Hal Ekleri (Akkusativ)"></div>
      <div class="form-row"><label for="metaDesc">Meta Açıklaması (SEO)</label><textarea id="metaDesc" rows="3" placeholder="Arama motorlarında görünecek kısa açıklama"></textarea></div>
      <div class="form-row-split">
        <div class="form-row"><label for="metaLevel">Seviye</label><select id="metaLevel"><option value="A1">A1</option><option value="A2">A2</option><option value="B1" selected>B1</option><option value="B2">B2</option><option value="C1">C1</option></select></div>
        <div class="form-row"><label for="metaDifficulty">Zorluk Derecesi</label><select id="metaDifficulty"><option value="Kolay">Kolay</option><option value="Orta" selected>Orta</option><option value="Zor">Zor</option></select></div>
      </div>

        <div class="form-row"><label for="metaReadTime">Okuma Süresi (dk)</label><input type="number" id="metaReadTime" min="1" max="60" value="5"></div>
        <div class="form-row"><label for="metaAuthor">Yazar Adı</label><input type="text" id="metaAuthor" placeholder="örn. Çetin Hoca"></div>

      <div class="form-row"><label for="metaCover">Kapak Görseli URL'si</label><input type="url" id="metaCover" placeholder="https://..."><div class="form-hint">Boş bırakılırsa kapak görseli olmadan üretilir.</div></div>

    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  let blocks = [];
  let seq = 0;
  const nextId = () => "b" + (++seq);

  const THEME_META = {
    amber: { label: "Sarı",    css: "#ffd250" },
    green: { label: "Yeşil",   css: "#4fd69c" },
    blue:  { label: "Mavi",    css: "#60a5fa" },
    rose:  { label: "Kırmızı", css: "#f07068" }
  };
  const CALLOUT_ICON = {
    amber: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    green: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>',
    blue:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    rose:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
  };

  function commonDefaults() { return { padY: 0, padX: 0, marginY: 0, bgColor: "", bgOpacity: 30 }; }
  function defaultsFor(type) {
    const base = commonDefaults();
    switch (type) {
      case "heading":
        return Object.assign(base, { level: "h2", text: "Başlık metni", size: 28, color: "#ffffff", weight: "700", font: "display", lineHeight: 150, letterSpacing: -1 });
      case "paragraph":
        return Object.assign(base, { html: "Paragraf metnini buraya yazın. Doğrudan tıklayıp düzenleyebilirsiniz.", size: 17, align: "left", color: "#cbd5e1", font: "body", lineHeight: 178, letterSpacing: -1 });
      case "image":
        return Object.assign(base, { url: "", alt: "", width: 100, radius: 16, align: "center" });
      case "vocab":
        return Object.assign(base, { de: "das Beispiel", tr: "örnek", phon: "das bai-şpiil", example: "Das ist nur ein Beispiel.", tip: "", tipEnabled: false });
      case "callout":
        return Object.assign(base, { theme: "amber", title: "Bilgi", html: "Öğrenciler için önemli bir not buraya yazılabilir." });
      case "table":
        return Object.assign(base, { headers: ["Sütun 1", "Sütun 2"], rows: [["", ""], ["", ""]] });
      default:
        return base;
    }
  }

  const TYPE_LABEL = { heading: "Başlık", paragraph: "Paragraf", image: "Görsel", vocab: "Kelime Kartı", callout: "Bilgi Kutusu", table: "Tablo" };

  const ICO = {
    up:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
    down:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>',
    gear:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    alignL:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>',
    alignC:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>',
    alignR:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>',
    alignJ:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>',
    plus:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    check: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    warn:  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    tip:   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>'
  };

  function iconFor(type) {
    switch (type) {
      case "heading":  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><path d="M6 12h12"/></svg>';
      case "paragraph":return ICO.alignL;
      case "image":    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
      case "vocab":    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
      case "callout":  return ICO.warn;
      case "table":    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="21"/></svg>';
      default: return "";
    }
  }

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fontStack(key) { return key === "display" ? "'Plus Jakarta Sans', sans-serif" : "'Inter', sans-serif"; }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
  function hexToRgba(hex, opacityPct) {
    if (!hex) return "transparent";
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return "rgba(" + r + "," + g + "," + b + "," + (opacityPct/100) + ")";
  }
  function wrapperStyle(b, forceTransparent) {
    const bg = forceTransparent ? "transparent" : (b.bgColor ? hexToRgba(b.bgColor, b.bgOpacity) : "transparent");
    return "padding:" + b.padY + "px " + b.padX + "px;margin:" + b.marginY + "px 0;background:" + bg + ";border-radius:12px;";
  }

  function toast(msg, type) {
    $all(".dc-toast").forEach(t => t.remove());
    const el = document.createElement("div");
    el.className = "dc-toast " + (type || "ok");
    el.innerHTML = (type === "err" ? ICO.warn : ICO.check) + "<span>" + esc(msg) + "</span>";
    document.body.appendChild(el);
    setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 2400);
  }

  function addBlock(type) {
    const block = Object.assign({ id: nextId(), type: type }, defaultsFor(type));
    blocks.push(block);
    renderAll();
    const el = $('.block[data-id="' + block.id + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function moveBlock(id, dir) {
    const i = blocks.findIndex(b => b.id === id);
    const j = dir === "up" ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= blocks.length) return;
    const tmp = blocks[i]; blocks[i] = blocks[j]; blocks[j] = tmp;
    renderAll();
  }
  function deleteBlock(id) {
    if (!confirm("Bu bloğu silmek istediğinize emin misiniz?")) return;
    blocks = blocks.filter(b => b.id !== id);
    renderAll();
  }
  function clearAll() {
    if (!blocks.length) return;
    if (!confirm("Tüm bloklar silinecek. Emin misiniz?")) return;
    blocks = []; renderAll();
  }

  function renderAll() {
    const canvas = $("#canvas");
    canvas.innerHTML = "";
    $("#blockCount").textContent = blocks.length + " blok";
    if (!blocks.length) {
      canvas.innerHTML =
        '<div class="empty-state"><div class="es-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>' +
        '<h3>Henüz blok yok</h3><p>Soldaki panelden bir blok türü seçerek dersinizi oluşturmaya başlayın.</p></div>';
      return;
    }
    blocks.forEach((block, idx) => canvas.appendChild(buildBlockEl(block, idx)));
  }

  function buildBlockEl(block, idx) {
    const wrap = document.createElement("div");
    wrap.className = "block"; wrap.dataset.id = block.id; wrap.dataset.type = block.type;

    const toolbar = document.createElement("div");
    toolbar.className = "block-toolbar";
    toolbar.innerHTML =
      '<div class="block-type-label">' + iconFor(block.type) + '<span>' + TYPE_LABEL[block.type] + '</span></div>' +
      '<div class="block-actions">' +
        '<button data-act="up" title="Yukarı taşı"' + (idx === 0 ? " disabled" : "") + '>' + ICO.up + '</button>' +
        '<button data-act="down" title="Aşağı taşı"' + (idx === blocks.length - 1 ? " disabled" : "") + '>' + ICO.down + '</button>' +
        '<button data-act="settings" title="Ayarlar">' + ICO.gear + '</button>' +
        '<button data-act="delete" class="danger" title="Bloğu sil">' + ICO.trash + '</button>' +
      '</div>';
    wrap.appendChild(toolbar);
    toolbar.querySelector('[data-act="up"]').addEventListener("click", () => moveBlock(block.id, "up"));
    toolbar.querySelector('[data-act="down"]').addEventListener("click", () => moveBlock(block.id, "down"));
    toolbar.querySelector('[data-act="delete"]').addEventListener("click", () => deleteBlock(block.id));
    const gearBtn = toolbar.querySelector('[data-act="settings"]');
    gearBtn.addEventListener("click", () => {
      const drawer = wrap.querySelector(".block-settings");
      const open = drawer.classList.toggle("open");
      gearBtn.classList.toggle("active", open);
    });

    wrap.appendChild(buildSettingsEl(block));

    const content = document.createElement("div");
    content.className = "block-content";
    content.style.cssText = wrapperStyle(block, block.type === "paragraph");
    buildContentEl(block, content);
    wrap.appendChild(content);
    return wrap;
  }

  function fg(label, inner) { return '<div class="field-group"><label>' + label + '</label>' + inner + '</div>'; }
  function selectHtml(field, opts, current) {
    let h = '<select data-f="' + field + '">';
    opts.forEach(o => { h += '<option value="' + o[0] + '"' + (o[0] === current ? " selected" : "") + '>' + o[1] + '</option>'; });
    return h + "</select>";
  }
  function rangeHtml(field, min, max, val, suffix) {
    return '<div style="display:flex;align-items:center;gap:8px;"><input type="range" data-f="' + field + '" min="' + min + '" max="' + max + '" value="' + val + '"><span class="range-val" data-rangeval>' + val + (suffix||"") + '</span></div>';
  }
  function alignBtnsHtml(field, current, noJustify) {
    const opts = [["left", ICO.alignL], ["center", ICO.alignC], ["right", ICO.alignR]];
    if (!noJustify) opts.push(["justify", ICO.alignJ]);
    let h = '<div class="align-btns" data-f="' + field + '">';
    opts.forEach(o => { h += '<button type="button" data-val="' + o[0] + '" class="' + (o[0] === current ? "active" : "") + '">' + o[1] + '</button>'; });
    return h + "</div>";
  }
  function themeBtnsHtml(current) {
    let h = '<div class="align-btns" data-f="theme">';
    Object.keys(THEME_META).forEach(k => { h += '<button type="button" data-val="' + k + '" class="' + (k === current ? "active" : "") + '" style="color:' + THEME_META[k].css + ';" title="' + THEME_META[k].label + '">●</button>'; });
    return h + "</div>";
  }
  function rgbaToHex(rgba) {
    if (!rgba) return "#ffffff";
    if (rgba[0] === "#") return rgba;
    const m = rgba.match(/[\d.]+/g);
    if (!m) return "#ffffff";
    const [r,g,b] = m;
    return "#" + [r,g,b].map(n => parseInt(n).toString(16).padStart(2,"0")).join("");
  }

  function buildSettingsEl(block) {
    const el = document.createElement("div");
    el.className = "block-settings";
    let h = "";

    if (block.type === "heading") {
      h += fg("Seviye", selectHtml("level", [["h1","H1"],["h2","H2"],["h3","H3"]], block.level));
      h += fg("Boyut (px)", rangeHtml("size", 16, 52, block.size));
      h += fg("Renk", '<input type="color" data-f="color" value="' + block.color + '">');
      h += fg("Kalınlık", selectHtml("weight", [["500","Orta"],["600","Yarı Kalın"],["700","Kalın"],["800","Ekstra Kalın"]], block.weight));
      h += fg("Font", selectHtml("font", [["display","Plus Jakarta Sans"],["body","Inter"]], block.font));
      h += fg("Satır Yüksekliği", rangeHtml("lineHeight", 110, 180, block.lineHeight, "%"));
      h += fg("Harf Aralığı (px)", rangeHtml("letterSpacing", -3, 4, block.letterSpacing));
    } else if (block.type === "paragraph") {
      h += fg("Boyut (px)", rangeHtml("size", 13, 26, block.size));
      h += fg("Hizalama", alignBtnsHtml("align", block.align));
      h += fg("Renk", '<input type="color" data-f="color" value="' + rgbaToHex(block.color) + '">');
      h += fg("Font", selectHtml("font", [["body","Inter"],["display","Plus Jakarta Sans"]], block.font));
      h += fg("Satır Yüksekliği", rangeHtml("lineHeight", 140, 220, block.lineHeight, "%"));
      h += fg("Harf Aralığı (px)", rangeHtml("letterSpacing", -2, 4, block.letterSpacing));
    } else if (block.type === "image") {
      h += fg("Genişlik (%)", rangeHtml("width", 20, 100, block.width));
      h += fg("Köşe Yuvarlama (px)", rangeHtml("radius", 0, 40, block.radius));
      h += fg("Hizalama", alignBtnsHtml("align", block.align, true));
    } else if (block.type === "callout") {
      h += fg("Tema", themeBtnsHtml(block.theme));
    }

    if (block.type !== "paragraph") {
      h += '<div class="settings-divider"></div><div class="settings-group-label">Boşluk &amp; Arka Plan</div>';
      h += fg("İç Boşluk Y (px)", rangeHtml("padY", 0, 60, block.padY));
      h += fg("İç Boşluk X (px)", rangeHtml("padX", 0, 60, block.padX));
      h += fg("Dış Boşluk (px)", rangeHtml("marginY", 0, 60, block.marginY));
      h += fg("Arka Plan Rengi", '<input type="color" data-f="bgColor" value="' + (block.bgColor || "#3b82f6") + '">');
      h += fg("Şeffaflık (%)", rangeHtml("bgOpacity", 0, 100, block.bgOpacity));
    } else {
      h += '<div class="settings-divider"></div><div class="settings-group-label">Boşluk (Arka plan her zaman şeffaftır)</div>';
      h += fg("İç Boşluk Y (px)", rangeHtml("padY", 0, 60, block.padY));
      h += fg("İç Boşluk X (px)", rangeHtml("padX", 0, 60, block.padX));
      h += fg("Dış Boşluk (px)", rangeHtml("marginY", 0, 60, block.marginY));
    }

    el.innerHTML = h;
    wireSettings(el, block);
    return el;
  }

  function wireSettings(el, block) {
    $all("select, input[type=color], input[type=range]", el).forEach(inp => {
      const field = inp.dataset.f;
      inp.addEventListener("input", () => {
        let val = inp.value;
        if (inp.type === "range") {
          val = Number(val);
          const span = inp.parentElement.querySelector("[data-rangeval]");
          if (span) span.textContent = val + (field === "lineHeight" ? "%" : "");
        }
        if (inp.type === "color" && field === "bgColor" && !block.bgColor) {
          if (!block.bgOpacity) block.bgOpacity = 30;
        }
        block[field] = val;
        applyBlockStyle(block);
      });
    });
    $all('[data-f="align"] button, [data-f="theme"] button', el).forEach(btn => {
      btn.addEventListener("click", () => {
        const group = btn.parentElement;
        const field = group.dataset.f;
        $all("button", group).forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        block[field] = btn.dataset.val;
        applyBlockStyle(block);
      });
    });
  }

  function applyBlockStyle(block) {
    const wrap = $('.block[data-id="' + block.id + '"]');
    if (!wrap) return;
    const contentEl = wrap.querySelector(".block-content");
    if (contentEl) contentEl.style.cssText = wrapperStyle(block, block.type === "paragraph");

    if (block.type === "heading") {
      const el2 = wrap.querySelector(".hp-editable");
      if (el2) el2.style.cssText = "font-family:" + fontStack(block.font) + ";font-size:" + block.size + "px;color:" + block.color + ";font-weight:" + block.weight + ";line-height:" + (block.lineHeight/100) + ";letter-spacing:" + block.letterSpacing + "px;";
    } else if (block.type === "paragraph") {
      const el2 = wrap.querySelector(".hp-editable");
      if (el2) el2.style.cssText = "font-family:" + fontStack(block.font) + ";font-size:" + block.size + "px;color:" + block.color + ";text-align:" + block.align + ";line-height:" + (block.lineHeight/100) + ";letter-spacing:" + block.letterSpacing + "px;";
    } else if (block.type === "image") {
      const img = wrap.querySelector("img.preview-img");
      const holder = wrap.querySelector(".img-align-holder");
      if (img) { img.style.width = block.width + "%"; img.style.borderRadius = block.radius + "px"; }
      if (holder) holder.style.textAlign = block.align;
    } else if (block.type === "callout") {
      const cbox = wrap.querySelector(".callout-prev");
      if (cbox) {
        cbox.dataset.theme = block.theme;
        const icoEl = cbox.querySelector(".callout-prev-ico");
        if (icoEl) icoEl.innerHTML = CALLOUT_ICON[block.theme];
      }
    }
  }

  function buildContentEl(block, content) {
    if (block.type === "heading") {
      const div = document.createElement("div");
      div.className = "hp-editable"; div.contentEditable = "true"; div.dataset.placeholder = "Başlık metni...";
      div.textContent = block.text;
      div.style.cssText = "font-family:" + fontStack(block.font) + ";font-size:" + block.size + "px;color:" + block.color + ";font-weight:" + block.weight + ";line-height:" + (block.lineHeight/100) + ";letter-spacing:" + block.letterSpacing + "px;";
      div.addEventListener("input", () => { block.text = div.textContent; });
      div.addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
      content.appendChild(div);

    } else if (block.type === "paragraph") {
      const div = document.createElement("div");
      div.className = "hp-editable"; div.contentEditable = "true"; div.dataset.placeholder = "Paragraf metni...";
      div.innerHTML = block.html;
      div.style.cssText = "font-family:" + fontStack(block.font) + ";font-size:" + block.size + "px;color:" + block.color + ";text-align:" + block.align + ";line-height:" + (block.lineHeight/100) + ";letter-spacing:" + block.letterSpacing + "px;";

      content.appendChild(div);

    } else if (block.type === "image") {

      const urlInput = urlRow.querySelector("input");
      content.appendChild(urlRow);

      const altRow = document.createElement("div");
      altRow.className = "img-alt-row";
      altRow.innerHTML = '<input type="text" placeholder="Alternatif metin (alt)" value="' + esc(block.alt) + '">';
      const altInput = altRow.querySelector("input");

      const holder = document.createElement("div");
      holder.className = "img-align-holder";
      holder.style.textAlign = block.align; holder.style.marginTop = "12px";

      function renderImgPreview() {
        holder.innerHTML = "";

          holder.innerHTML = '<div class="img-block-empty"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Görsel URL adresi girin</span></div>';
        }
      }
      urlInput.addEventListener("input", () => { block.url = urlInput.value.trim(); renderImgPreview(); });
      altInput.addEventListener("input", () => { block.alt = altInput.value; });
      renderImgPreview();
      content.appendChild(altRow); content.appendChild(holder);

    } else if (block.type === "vocab") {
      const card = document.createElement("div");
      card.className = "vocab-card-prev";
      card.innerHTML =
        '<div class="vocab-grid">' +
          '<div><label>Almanca</label><input type="text" data-f="de" value="' + esc(block.de) + '" class="de-input"></div>' +
          '<div><label>Türkçe</label><input type="text" data-f="tr" value="' + esc(block.tr) + '"></div>' +
          '<div class="full"><label>Okunuşu</label><input type="text" data-f="phon" value="' + esc(block.phon) + '"></div>' +
          '<div class="full"><label>Örnek Cümle</label><input type="text" data-f="example" value="' + esc(block.example) + '"></div>' +
        '</div>' +
        '<button type="button" class="vocab-tip-toggle">' + ICO.tip + '<span data-tiplabel>' + (block.tipEnabled ? "İpucunu kaldır" : "+ İpucu / Gramer Notu ekle") + '</span></button>' +
        '<div class="vocab-tip-wrap" style="display:' + (block.tipEnabled ? "block" : "none") + ';"><textarea placeholder="örn. Akkusativ hali der → den değişimini gerektirir.">' + esc(block.tip) + '</textarea></div>';

      $all("input", card).forEach(inp => inp.addEventListener("input", () => { block[inp.dataset.f] = inp.value; }));
      const tipToggle = card.querySelector(".vocab-tip-toggle");
      const tipWrap = card.querySelector(".vocab-tip-wrap");
      const tipLabel = card.querySelector("[data-tiplabel]");
      const tipArea = card.querySelector("textarea");
      tipToggle.addEventListener("click", () => {
        block.tipEnabled = !block.tipEnabled;
        tipWrap.style.display = block.tipEnabled ? "block" : "none";
        tipLabel.textContent = block.tipEnabled ? "İpucunu kaldır" : "+ İpucu / Gramer Notu ekle";
        if (block.tipEnabled) tipArea.focus();
      });
      tipArea.addEventListener("input", () => { block.tip = tipArea.value; });
      content.appendChild(card);

    } else if (block.type === "callout") {
      const box = document.createElement("div");
      box.className = "callout-prev"; box.dataset.theme = block.theme;
      box.innerHTML =
        '<div class="callout-prev-ico">' + CALLOUT_ICON[block.theme] + '</div>' +
        '<div class="callout-prev-body-wrap">' +
          '<div class="callout-prev-title" contenteditable="true" data-placeholder="Başlık">' + esc(block.title) + '</div>' +
          '<div class="callout-prev-body" contenteditable="true" data-placeholder="Metin...">' + block.html + '</div>' +
        '</div>';
      box.querySelector(".callout-prev-title").addEventListener("input", function () { block.title = this.textContent; });
      box.querySelector(".callout-prev-body").addEventListener("input", function () { block.html = this.innerHTML; });
      content.appendChild(box);

    } else if (block.type === "table") {
      const wrap2 = document.createElement("div");
      const toolbarRow = document.createElement("div");
      toolbarRow.className = "table-toolbar";
      toolbarRow.innerHTML = '<button class="btn btn-sm" data-tact="addrow">' + ICO.plus + ' Satır</button><button class="btn btn-sm" data-tact="addcol">' + ICO.plus + ' Sütun</button>';
      wrap2.appendChild(toolbarRow);

      const tableEl = document.createElement("table");
      tableEl.className = "tbl-prev";

      function renderTable() {
        let h = "<thead><tr>";
        block.headers.forEach((hd, ci) => {
          h += '<th><div class="tbl-cell-wrap"><span contenteditable="true" data-h="' + ci + '">' + esc(hd) + '</span>' +
            (block.headers.length > 1 ? '<button class="tbl-del-col" data-delcol="' + ci + '" title="Sütunu sil">×</button>' : "") + '</div></th>';
        });
        h += "</tr></thead><tbody>";
        block.rows.forEach((row, ri) => {
          h += '<tr>';
          row.forEach((cell, ci) => {
            h += '<td><div class="tbl-cell-wrap"><span contenteditable="true" data-r="' + ri + '" data-c="' + ci + '">' + esc(cell) + '</span>' +
              (ci === row.length - 1 && block.rows.length > 1 ? '<button class="tbl-del-row" data-delrow="' + ri + '" title="Satırı sil">×</button>' : "") + '</div></td>';
          });
          h += '</tr>';
        });
        h += "</tbody>";
        tableEl.innerHTML = h;
        $all("[data-h]", tableEl).forEach(s => s.addEventListener("input", () => { block.headers[+s.dataset.h] = s.textContent; }));
        $all("[data-r]", tableEl).forEach(s => s.addEventListener("input", () => { block.rows[+s.dataset.r][+s.dataset.c] = s.textContent; }));
        $all("[data-delcol]", tableEl).forEach(b => b.addEventListener("click", () => { const ci=+b.dataset.delcol; block.headers.splice(ci,1); block.rows.forEach(r=>r.splice(ci,1)); renderTable(); }));
        $all("[data-delrow]", tableEl).forEach(b => b.addEventListener("click", () => { block.rows.splice(+b.dataset.delrow,1); renderTable(); }));
      }
      renderTable();
      wrap2.appendChild(tableEl);
      toolbarRow.querySelector('[data-tact="addrow"]').addEventListener("click", () => { block.rows.push(block.headers.map(()=>"")); renderTable(); });
      toolbarRow.querySelector('[data-tact="addcol"]').addEventListener("click", () => { block.headers.push("Sütun " + (block.headers.length+1)); block.rows.forEach(r=>r.push("")); renderTable(); });
      content.appendChild(wrap2);
    }

  $("#closeExportModal").addEventListener("click", () => overlay.classList.remove("open"));

    const html = buildExportHtml({ title, description, level, difficulty, readTime, author, cover });
    downloadHtml(html);

  function downloadHtml(htmlStr) {
    const blob = new Blob([htmlStr], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function renderBlockExport(b) {
    const forceTransparent = b.type === "paragraph";
    const wrapOpen = '<div style="' + wrapperStyle(b, forceTransparent) + '">';
    const wrapClose = "</div>";
    switch (b.type) {
      case "heading":
        return wrapOpen + "<" + b.level + ' style="font-family:' + fontStack(b.font) + ";font-size:" + b.size + "px;color:" + b.color + ";font-weight:" + b.weight + ";line-height:" + (b.lineHeight/100) + ";letter-spacing:" + b.letterSpacing + 'px;">' + esc(b.text) + "</" + b.level + ">" + wrapClose;

      case "paragraph":
        return wrapOpen + '<p style="font-family:' + fontStack(b.font) + ";font-size:" + b.size + "px;color:" + b.color + ";text-align:" + b.align + ";line-height:" + (b.lineHeight/100) + ";letter-spacing:" + b.letterSpacing + 'px;background:transparent;">' + b.html + "</p>" + wrapClose;

      case "image":
        if (!b.url) return "";
        return wrapOpen + '<div style="text-align:' + b.align + ';">' +
          '<img src="' + esc(b.url) + '" alt="' + esc(b.alt) + '" style="width:' + b.width + '%;max-width:100%;height:auto;border-radius:' + b.radius + 'px;box-shadow:0 16px 40px rgba(0,0,0,.4);">' +
          "</div>" + wrapClose;

      case "vocab":
        return wrapOpen + '<div class="vocab-card">' +
          '<div class="vocab-de">' + esc(b.de) + "</div>" +
          (b.phon ? '<div class="vocab-phon">[' + esc(b.phon) + "]</div>" : "") +
          '<div class="vocab-tr">' + esc(b.tr) + "</div>" +
          (b.example ? '<div class="vocab-example">' + esc(b.example) + "</div>" : "") +
          (b.tipEnabled && b.tip ? '<div class="vocab-tip"><strong>İpucu:</strong> ' + esc(b.tip) + "</div>" : "") +
          "</div>" + wrapClose;

      case "callout":
        return wrapOpen + '<div class="callout-box" data-theme="' + b.theme + '">' +
          '<div class="callout-ico">' + CALLOUT_ICON[b.theme] + '</div>' +
          '<div class="callout-body-wrap"><div class="callout-title">' + esc(b.title) + '</div><div class="callout-text">' + b.html + "</div></div>" +
          "</div>" + wrapClose;

      case "table": {
        let t = wrapOpen + '<div style="overflow-x:auto;"><table class="lb-table"><thead><tr>';
        b.headers.forEach(h => { t += "<th>" + esc(h) + "</th>"; });
        t += "</tr></thead><tbody>";
        b.rows.forEach(row => { t += "<tr>"; row.forEach(c => { t += "<td>" + esc(c) + "</td>"; }); t += "</tr>"; });
        t += "</tbody></table></div>" + wrapClose;
        return t;
      }
      default: return "";
    }
  }
