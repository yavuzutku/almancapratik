<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Bankam — Almanca Sözlüğüm | AlmancaPratik</title>
  <meta name="description" content="Kaydettiğin Almanca kelimeleri listele, filtrele, etiketle ve düzenle.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1326">
  <meta property="og:title" content="Kelime Bankam — AlmancaPratik">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">

  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebApplication","name":"AlmancaPratik — Kelime Bankam",
   "applicationCategory":"EducationalApplication","inLanguage":["tr","de"],
   "offers":{"@type":"Offer","price":"0","priceCurrency":"TRY"}}
  </script>

  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="./kelimeler.css">
</head>
<body>

<div class="page-wrapper">

  <!-- ══════════════════════ BAŞLIK ══════════════════════ -->
  <header class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Kelime Bankam</h1>
      <div class="page-title-meta">
        <span class="word-count-badge" id="wordCountBadge" aria-live="polite">—</span>
        <span class="page-subtitle">Düzenli olarak güncelleniyor.</span>
      </div>
    </div>
    <a href="../wordsadd/" class="add-word-btn" aria-label="Yeni kelime ekle">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Kelime Ekle
    </a>
  </header>

  <!-- ══════════════════════ ARAMA ══════════════════════
       Sadece arama inputu buraya konur.
       #wordToolbar ve #statsBar, kelimeler.js tarafından
       .content-layout öncesine inject edilir — böylece
       tüm event listener'lar doğru çalışır.
  ═════════════════════════════════════════════════════ -->
  <div class="search-panel" role="search">
    <div class="search-input-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <label for="searchInput" class="sr-only">Kelime ara</label>
      <input type="search" id="searchInput"
             placeholder="Kelime veya anlam ara…"
             autocomplete="off" spellcheck="false"/>
      <button class="search-clear" id="searchClear" aria-label="Aramayı temizle" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ══════════════════════ ANA LAYOUT ══════════════════════
       JS şu sırayla inject eder (bu div'den önce):
         1. #wordToolbar   → sort + view + select + liste butonları
         2. #statsBar      → "X kelime gösteriliyor" bilgisi
  ═════════════════════════════════════════════════════════ -->
  <div class="content-layout">

    <!-- Sidebar: etiket filtreleri -->
    <aside class="filter-sidebar" aria-label="Etiket filtreleri">
      <div class="filter-sidebar-title">Etiketler</div>
      <nav class="filter-tag-list" id="filterTagList" aria-label="Etiket listesi"></nav>
    </aside>

    <!-- Kelime listesi -->
    <main class="word-list-area">
      <div class="word-list" id="wordList" role="list" aria-label="Kelime listesi">

        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-illustration">
            <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
              <rect x="8" y="12" width="48" height="40" rx="6" stroke="currentColor"
                    stroke-width="1.5" stroke-dasharray="4 3"/>
              <line x1="20" y1="26" x2="44" y2="26" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round"/>
              <line x1="20" y1="34" x2="36" y2="34" stroke="currentColor"
                    stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="empty-title">Henüz kelime eklenmedi</div>
          <div class="empty-desc">Okuma modunda kelime kaydet ya da manuel ekle.</div>
          <a href="../wordsadd/" class="empty-cta">İlk kelimeni ekle</a>
        </div>

      </div>
    </main>

  </div><!-- /.content-layout -->

</div><!-- /.page-wrapper -->

<h2 class="sr-only" id="word-list-heading">Kayıtlı Kelimeler</h2>

<script type="module">
  import "../js/core.js";
  window.loadNavbar?.();
  import { initAuthWall } from '../src/components/authWall.js';
  initAuthWall({
    icon:     'K',
    title:    'Kelimelerini görmek için giriş yap',
    desc:     'Kaydettiğin tüm Almanca kelimeler, anlamları ve etiketleriyle seni bekliyor.',
    features: ['Sınırsız kelime', 'Etiket sistemi', 'Arama ve filtreleme'],
    backHref: '../pratik/'
  });
</script>
<script type="module" src="./kelimeler.js"></script>

</body>
</html>
