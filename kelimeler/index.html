<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelime Bankam — Almanca Sözlüğüm | AlmancaPratik</title>
  <meta name="description" content="Kaydettiğin Almanca kelimeleri listele, filtrele, etiketle ve düzenle. Kendi kişisel Almanca kelime bankanı oluştur, anlamlarını ve etiketlerini yönet.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1326">

  <meta property="og:title" content="Kelime Bankam — AlmancaPratik">
  <meta property="og:description" content="Kişisel Almanca kelime bankan. Kaydettiğin tüm kelimeleri, anlamları ve etiketleri tek ekranda yönet.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AlmancaPratik — Kelime Bankam",
    "description": "Kişisel Almanca kelime yönetim aracı.",
    "applicationCategory": "EducationalApplication",
    "inLanguage": ["tr", "de"],
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" }
  }
  </script>

  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="./kelimeler.css">
</head>
<body>

<div class="page-wrapper">

  <!-- ── SAYFA BAŞLIĞI ── -->
  <header class="page-header">
    <div class="page-header-left">
      <h1 class="page-title">Kelime Bankam</h1>
      <div class="page-title-meta">
        <span class="word-count-badge" id="wordCountBadge" aria-live="polite">—</span>
        <span class="page-subtitle">Düzenli olarak güncelleniyor.</span>
      </div>
    </div>

    <div class="page-header-right">
      <button class="header-btn header-btn--ghost" id="headerCreateListBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Liste Oluştur</span>
      </button>

      <div class="view-switcher" role="group" aria-label="Görünüm">
        <button id="viewToggle" class="view-switcher-btn" title="Görünüm değiştir" aria-label="Görünüm değiştir">
          <svg id="viewIconList" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <svg id="viewIconGrid" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
      </div>

      <a href="../wordsadd/" class="add-word-btn" aria-label="Yeni kelime ekle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Kelime Ekle
      </a>
    </div>
  </header>

  <!-- ── ARAMA + FİLTRE BAR ── -->
  <div class="search-filter-bar" role="search">
    <div class="search-input-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <label for="searchInput" class="sr-only">Kelime ara</label>
      <input type="search" id="searchInput" placeholder="Kelime veya anlam ara…" autocomplete="off" spellcheck="false"/>
      <button class="search-clear" id="searchClear" aria-label="Aramayı temizle" style="display:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Sort chips — toolbar'a inject edilmeden önce görsel placeholder -->
    <div class="sort-chips-wrap" id="sortChipsWrap">
      <span class="sort-label">Sırala:</span>
      <div class="sort-group" role="group" aria-label="Sıralama">
        <button class="sort-btn active" data-sort="newest">En Yeni</button>
        <button class="sort-btn" data-sort="oldest">En Eski</button>
        <button class="sort-btn" data-sort="az">A → Z</button>
        <button class="sort-btn" data-sort="level">Seviye</button>
      </div>
      <button class="select-mode-btn" id="selectModeBtn" title="Kelime seç">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Seç</span>
      </button>
    </div>
  </div>

  <!-- ── ANA LAYOUT ── -->
  <div class="content-layout">

    <!-- SIDEBAR -->
    <aside class="filter-sidebar" aria-label="Etiket filtreleri">
      <div class="filter-sidebar-title">Etiketler</div>
      <nav class="filter-tag-list" id="filterTagList" aria-label="Etiket listesi"></nav>
    </aside>

    <!-- KELİME LİSTESİ -->
    <main class="word-list-area">
      <!-- Stats -->
      <div id="statsBar" class="stats-bar" style="display:none"></div>

      <div class="word-list" id="wordList" role="list" aria-label="Kelime listesi">
        <!-- Boş durum -->
        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-illustration">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="12" width="48" height="40" rx="6" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
              <line x1="20" y1="26" x2="44" y2="26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="20" y1="34" x2="36" y2="34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="empty-title">Henüz kelime eklenmedi</div>
          <div class="empty-desc">Okuma modunda bir kelime seçip kaydet butonuna bas — ya da manuel ekle.</div>
          <a href="../wordsadd/" class="empty-cta">İlk kelimeni ekle</a>
        </div>
      </div>
    </main>

  </div>

</div>

<h2 class="sr-only" id="word-list-heading">Kayıtlı Kelimeler</h2>

<script type="module">
  import "../js/core.js";
  window.loadNavbar?.();
  import { initAuthWall } from '../src/components/authWall.js';
  initAuthWall({
    icon:     'K',
    title:    'Kelimelerini görmek için giriş yap',
    desc:     'Kaydettiğin tüm Almanca kelimeler, anlamları ve etiketleriyle seni bekliyor.',
    features: ['Sınırsız kelime', 'Etiket sistemi', 'Arama ve filtreleme'],
    backHref: '../pratik/'
  });
</script>
<script type="module" src="./kelimeler.js"></script>
<script>
  /* Header "Liste Oluştur" butonu → JS'teki createListBtn ile aynı işi yapması için
     JS yüklendikten sonra click'i yönlendirir */
  document.getElementById('headerCreateListBtn')?.addEventListener('click', () => {
    document.getElementById('createListBtn')?.click();
  });
</script>

</body>
</html>
