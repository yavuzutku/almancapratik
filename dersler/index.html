<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dersler — AlmancaPratik</title>
  <meta name="description" id="metaDescriptionTag" content="AlmancaPratik Almanca dersleri. A1'den C1'e kategorilere göre yapılandırılmış Almanca ders içerikleri.">
  <link rel="canonical" id="canonicalTag" href="https://almancapratik.com/dersler/">
  <meta property="og:type" content="website" id="ogTypeTag">
  <meta property="og:site_name" content="AlmancaPratik">
  <meta property="og:title" id="ogTitleTag" content="Dersler — AlmancaPratik">
  <meta property="og:description" id="ogDescTag" content="A1'den C1'e kategorilere göre yapılandırılmış Almanca ders içerikleri.">
  <meta property="og:url" id="ogUrlTag" content="https://almancapratik.com/dersler/">
  <meta property="og:image" id="ogImageTag" content="https://almancapratik.com/favicon.ico">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json" id="jsonLdTag">{}</script>
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="./dersler.css">
</head>
<body>

<div class="bg-canvas" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>
</div>

<!-- ══════════════ LIST VIEW ══════════════ -->
<div id="viewList">
  <div class="page-wrap">

    <div class="page-header">
      <div class="page-header-left">
        <div class="page-eyebrow"><span class="eyebrow-dot"></span>AlmancaPratik</div>
        <h1 class="page-title">Dersler</h1>
        <p class="page-subtitle">A1'den C1'e, seviyene göre yapılandırılmış Almanca ders içerikleri burada bir araya geliyor.</p>
      </div>
    </div>

    <!-- Arama -->
    <div class="lessons-search-row">
      <div class="lessons-search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="lessonSearchInput" class="lessons-search-input" placeholder="Ders ara…" autocomplete="off">
      </div>
      <span class="lessons-count" id="lessonsCount"></span>
    </div>

    <!-- Kategori filtreleri -->
    <div class="cat-filter-wrap" id="catFilterWrap">
      <button class="cat-filter-btn active" data-cat="all">Tümü</button>
      <button class="cat-filter-btn" data-cat="A1">A1</button>
      <button class="cat-filter-btn" data-cat="A2">A2</button>
      <button class="cat-filter-btn" data-cat="B1">B1</button>
      <button class="cat-filter-btn" data-cat="B2">B2</button>
      <button class="cat-filter-btn" data-cat="C1">C1</button>
      <!-- Özel kategoriler JS ile eklenir -->
    </div>

    <div class="lessons-grid" id="lessonsGrid">
      <div class="grid-loading"><div class="spinner"></div></div>
    </div>

  </div>
</div>

<!-- ══════════════ DERS OKUMA VIEW ══════════════ -->
<div id="viewLesson">
  <div class="reading-progress-bar" id="readingProgressBar"></div>
  <div class="lesson-wrap">

    <nav class="lesson-breadcrumb" id="lessonBreadcrumb" aria-label="breadcrumb"></nav>

    <div class="lesson-nav-row">
      <button class="lesson-back" id="btnBackFromLesson">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        Tüm dersler
      </button>
      <div class="lesson-admin-actions" id="lessonAdminActions" style="display:none">
        <button class="lesson-admin-btn lesson-admin-btn--danger" id="btnDeleteCurrentLesson">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Sil
        </button>
      </div>
    </div>

    <img id="lessonHeroImg" class="lesson-hero-img" src="" alt="" style="display:none">

    <div class="lesson-meta-row">
      <span class="lesson-cat-badge" id="lessonCatBadge" style="display:none"></span>
      <span id="lessonDate"></span>
      <span class="lesson-card-dot"></span>
      <span id="lessonReadTime"></span>
      <span class="draft-badge" id="lessonDraftBadge" style="display:none">Taslak</span>
      <button class="lesson-share-btn" id="btnShareLesson" title="Paylaş">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Paylaş
      </button>
    </div>

    <h1 class="lesson-heading" id="lessonHeading"></h1>
    <div class="lesson-body" id="lessonBody"></div>

    <div class="lesson-prevnext-row" id="lessonPrevNextRow"></div>

    <div class="lesson-related" id="lessonRelated"></div>

  </div>
</div>

<!-- Silme onayı -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-card">
    <div class="confirm-title">Dersi Sil</div>
    <p class="confirm-desc">Bu ders kalıcı olarak silinecek. Bu işlem geri alınamaz.</p>
    <div class="confirm-actions">
      <button class="btn-confirm-cancel" id="confirmCancel">İptal</button>
      <button class="btn-confirm-delete" id="confirmDelete">Evet, Sil</button>
    </div>
  </div>
</div>

<!-- Navbar -->
<script type="module">
  import "../js/core.js";
  window.loadNavbar();
</script>

<!-- Dersler logic -->
<script type="module" src="./dersler.js"></script>

</body>
</html>
